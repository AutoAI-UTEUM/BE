name: AI Service CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service-build:
    name: ai-service-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: |
            ai-service/pyproject.toml
            ai-service/uv.lock

      - name: Sync ai-service dependencies
        working-directory: ai-service
        run: uv sync --locked --dev

      - name: Check ai-service formatting
        working-directory: ai-service
        run: uv run --locked ruff format --check src tests demo.py

      - name: Lint ai-service
        working-directory: ai-service
        run: uv run --locked ruff check src tests demo.py

      - name: Type-check ai-service
        working-directory: ai-service
        run: uv run --locked mypy src tests demo.py

      - name: Test ai-service
        working-directory: ai-service
        run: uv run --locked pytest -q
