# Existing dev environment credentials/permissions are retained.
# No push trigger: merging this safety path or the product PRs never deploys.
name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a reviewed Main image only, or use the existing full deployment contract
        required: true
        type: choice
        default: deploy
        options: [deploy, build-only]
      reviewed_source:
        description: Source/CI/catalog review JSON for build-only; never a runtime authorization
        required: false
        type: string
      release_contract:
        description: Explicit reviewed migration and recovery contract (V65 needs schemaVersion 2 metadata)
        required: true
        type: choice
        default: v64
        options:
          - v64
          - v65-prior-consent
      approved_sha:
        description: Exact reviewed develop SHA with successful combined Main/AI CI
        required: true
        type: string
      reviewed_manifest:
        description: Reviewed fresh runtime, rollback, budget and CI metadata JSON (no secrets)
        required: false
        type: string
      verified_host_fingerprint:
        description: Existing verified DEV host SHA256 fingerprint from trusted known_hosts
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      catalog_sha256: ${{ steps.source.outputs.catalog_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate mode-specific inputs without image or server actions
        id: source
        env:
          DEV_OPERATION: ${{ inputs.operation }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_CONTRACT: ${{ inputs.release_contract }}
          REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
          REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest }}
          VERIFIED_HOST_FINGERPRINT: ${{ inputs.verified_host_fingerprint }}
        run: python3 -I -S -B scripts/deploy/dev_image_source.py

  build-only:
    needs: review
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.approved_sha == github.sha && inputs.operation == 'build-only'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Main only; never connect to DEV
        id: main_image
        uses: docker/build-push-action@v6
        with:
          context: ./main-service
          file: ./main-service/Dockerfile
          push: true
          tags: ghcr.io/autoai-uteum/main-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.uteum.dev-release-contract=${{ inputs.release_contract }}
            com.uteum.flyway-catalog-sha256=${{ needs.review.outputs.catalog_sha256 }}
            com.uteum.deletion-ledger-format=1
      - name: Record the actual image result without runtime authorization
        env:
          DEV_OPERATION: build-only
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_CONTRACT: ${{ inputs.release_contract }}
          REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
          IMAGE_DIGEST: ${{ steps.main_image.outputs.digest }}
        run: |
          python3 -I -S -B scripts/deploy/dev_image_source.py --image-digest "$IMAGE_DIGEST" --output "$RUNNER_TEMP/main-image-source.json"
          cat "$RUNNER_TEMP/main-image-source.json" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: review
    name: deploy-dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.approved_sha == github.sha && inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate reviewed metadata before image build or SSH
        id: reviewed
        shell: bash
        env:
          REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest }}
          VERIFIED_HOST_FINGERPRINT: ${{ inputs.verified_host_fingerprint }}
          RELEASE_CONTRACT: ${{ inputs.release_contract }}
        run: python3 -I -S -B scripts/deploy/dev_main_only.py --prepare --release-contract "$RELEASE_CONTRACT" --output "$RUNNER_TEMP/dev-main-only.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reviewed Main image only
        id: main_image
        uses: docker/build-push-action@v6
        with:
          context: ./main-service
          file: ./main-service/Dockerfile
          push: true
          tags: ghcr.io/autoai-uteum/main-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.uteum.dev-release-contract=${{ inputs.release_contract }}
            com.uteum.flyway-catalog-sha256=${{ steps.reviewed.outputs.catalog_sha256 }}
            com.uteum.deletion-ledger-format=1

      - name: Verify current DEV and replace Main only
        shell: bash
        env:
          NEW_MAIN_DIGEST: ghcr.io/autoai-uteum/main-service@${{ steps.main_image.outputs.digest }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_PASSPHRASE: ${{ secrets.DEV_SSH_PASSPHRASE }}
          VERIFIED_HOST_FINGERPRINT: ${{ inputs.verified_host_fingerprint }}
        run: python3 -I -S -B scripts/deploy/dev_ssh_ed25519.py --script "$RUNNER_TEMP/dev-main-only.sh"
