# Existing dev environment credentials/permissions are retained.
# No push trigger: merging this safety path or the product PRs never deploys.
name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed develop SHA with successful combined Main/AI CI
        required: true
        type: string
      reviewed_manifest:
        description: Reviewed fresh runtime, rollback, budget and CI metadata JSON (no secrets)
        required: true
        type: string
      verified_host_fingerprint:
        description: Existing verified DEV host SHA256 fingerprint from trusted known_hosts
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate reviewed metadata before image build or SSH
        shell: bash
        env:
          REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest }}
          VERIFIED_HOST_FINGERPRINT: ${{ inputs.verified_host_fingerprint }}
        run: python3 -I -S -B scripts/deploy/dev_main_only.py --prepare --output "$RUNNER_TEMP/dev-main-only.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reviewed Main image only
        id: main_image
        uses: docker/build-push-action@v6
        with:
          context: ./main-service
          file: ./main-service/Dockerfile
          push: true
          tags: ghcr.io/autoai-uteum/main-service:${{ github.sha }}

      - name: Verify current DEV and replace Main only
        uses: appleboy/ssh-action@v1
        env:
          NEW_MAIN_DIGEST: ghcr.io/autoai-uteum/main-service@${{ steps.main_image.outputs.digest }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          fingerprint: ${{ inputs.verified_host_fingerprint }}
          envs: NEW_MAIN_DIGEST,DEV_DEPLOY_PATH,GHCR_TOKEN,GHCR_USERNAME
          script_path: ${{ runner.temp }}/dev-main-only.sh
          command_timeout: 8m
          debug: false
          allenvs: false
          request_pty: false
