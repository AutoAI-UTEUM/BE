name: Main Service CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: main-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-service-build:
    name: main-service-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect main-service changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "service=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            main-service .github/workflows/main-service-ci.yml; then
            echo "service=false" >> "$GITHUB_OUTPUT"
          else
            echo "service=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.changes.outputs.service == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.changes.outputs.service == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test main-service
        if: steps.changes.outputs.service == 'true'
        working-directory: main-service
        run: ./gradlew build --no-daemon

      - name: Upload main-service test reports
        if: always() && steps.changes.outputs.service == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: main-service-test-reports-${{ github.run_id }}
          path: |
            main-service/build/reports/tests/
            main-service/build/test-results/
          if-no-files-found: warn
