[project]
name = "edupilot-ai-service"
version = "0.1.0"
description = "EduPilot internal AI service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "edupilot_ai"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires explicit opt-in and real external credentials",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
