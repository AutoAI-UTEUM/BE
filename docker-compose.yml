name: edupilot

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${EDUPILOT_DB_NAME}
      MYSQL_USER: ${EDUPILOT_DB_USERNAME}
      MYSQL_PASSWORD: ${EDUPILOT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EDUPILOT_DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    # ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edupilot-net

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      EDUPILOT_DB_URL: ${EDUPILOT_DB_URL}
      EDUPILOT_DB_USERNAME: ${EDUPILOT_DB_USERNAME}
      EDUPILOT_DB_PASSWORD: ${EDUPILOT_DB_PASSWORD}
      EDUPILOT_CORS_ALLOWED_ORIGINS: ${EDUPILOT_CORS_ALLOWED_ORIGINS}
      EDUPILOT_JWT_SECRET: ${EDUPILOT_JWT_SECRET}
      EDUPILOT_AI_BASE_URL: ${EDUPILOT_AI_BASE_URL:-http://ai-service:8000}
      EDUPILOT_INTERNAL_TOKEN: ${EDUPILOT_INTERNAL_TOKEN}
      EDUPILOT_STORAGE_DIR: /var/lib/edupilot/storage
      EDUPILOT_UPLOAD_MAX_MB: ${EDUPILOT_UPLOAD_MAX_MB:-45}
      EDUPILOT_AI_EXTRACT_READ_TIMEOUT: ${EDUPILOT_AI_EXTRACT_READ_TIMEOUT:-120s}
      EDUPILOT_AI_TURN_READ_TIMEOUT: ${EDUPILOT_AI_TURN_READ_TIMEOUT:-180s}
      EDUPILOT_AI_GRADE_READ_TIMEOUT: ${EDUPILOT_AI_GRADE_READ_TIMEOUT:-90s}
      EDUPILOT_AI_PIPELINE_READ_TIMEOUT: ${EDUPILOT_AI_PIPELINE_READ_TIMEOUT:-45s}
      EDUPILOT_QUIZ_PASS_RATIO: ${EDUPILOT_QUIZ_PASS_RATIO:-0.6}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads:/var/lib/edupilot/storage
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - edupilot-net

  ai-service:
    profiles:
      - ai
    # TODO(#45): AI 담당자와 이미지 빌드·배포 계약을 확정한 뒤 실제 이미지로 교체한다.
    image: ${AI_SERVICE_IMAGE:-ghcr.io/autoai-edupilot/ai-service:pending}
    environment:
      EDUPILOT_INTERNAL_TOKEN: ${EDUPILOT_INTERNAL_TOKEN}
      XAI_API_KEY: ${XAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-grok-4.5}
    expose:
      - "8000"
    networks:
      - edupilot-net

volumes:
  mysql-data:
  uploads:

networks:
  edupilot-net:
    driver: bridge
