name: edupilot

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${EDUPILOT_DB_NAME}
      MYSQL_USER: ${EDUPILOT_DB_USERNAME}
      MYSQL_PASSWORD: ${EDUPILOT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EDUPILOT_DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    # ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edupilot-net

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    environment:
      # Only variables listed here are passed from .env; add new application.yml EDUPILOT_* placeholders here too.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      EDUPILOT_DB_URL: ${EDUPILOT_DB_URL}
      EDUPILOT_DB_USERNAME: ${EDUPILOT_DB_USERNAME}
      EDUPILOT_DB_PASSWORD: ${EDUPILOT_DB_PASSWORD}
      EDUPILOT_CORS_ALLOWED_ORIGINS: ${EDUPILOT_CORS_ALLOWED_ORIGINS}
      EDUPILOT_JWT_SECRET: ${EDUPILOT_JWT_SECRET}
      EDUPILOT_AI_BASE_URL: ${EDUPILOT_AI_BASE_URL:-http://ai-service:8000}
      EDUPILOT_INTERNAL_TOKEN: ${EDUPILOT_INTERNAL_TOKEN}
      EDUPILOT_STORAGE_DIR: /var/lib/edupilot/storage
      EDUPILOT_UPLOAD_MAX_MB: ${EDUPILOT_UPLOAD_MAX_MB:-45}
      EDUPILOT_MATERIAL_EXTRACTION_STUCK_THRESHOLD: ${EDUPILOT_MATERIAL_EXTRACTION_STUCK_THRESHOLD:-PT30M}
      EDUPILOT_OUTLINE_BACKFILL_BATCH: ${EDUPILOT_OUTLINE_BACKFILL_BATCH:-3}
      EDUPILOT_AI_EXTRACT_READ_TIMEOUT: ${EDUPILOT_AI_EXTRACT_READ_TIMEOUT:-120s}
      EDUPILOT_AI_OUTLINE_TIMEOUT: ${EDUPILOT_AI_OUTLINE_TIMEOUT:-110s}
      EDUPILOT_AI_TURN_READ_TIMEOUT: ${EDUPILOT_AI_TURN_READ_TIMEOUT:-200s}
      EDUPILOT_AI_STREAM_IDLE_TIMEOUT: ${EDUPILOT_AI_STREAM_IDLE_TIMEOUT:-30s}
      EDUPILOT_AI_GRADE_READ_TIMEOUT: ${EDUPILOT_AI_GRADE_READ_TIMEOUT:-110s}
      EDUPILOT_AI_PIPELINE_READ_TIMEOUT: ${EDUPILOT_AI_PIPELINE_READ_TIMEOUT:-45s}
      EDUPILOT_AI_ASSESSMENT_READ_TIMEOUT: ${EDUPILOT_AI_ASSESSMENT_READ_TIMEOUT:-55s}
      EDUPILOT_AI_DIAGNOSIS_READ_TIMEOUT: ${EDUPILOT_AI_DIAGNOSIS_READ_TIMEOUT:-55s}
      EDUPILOT_AI_REPORT_READ_TIMEOUT: ${EDUPILOT_AI_REPORT_READ_TIMEOUT:-220s}
      EDUPILOT_AI_REPORT_QUERY_READ_TIMEOUT: ${EDUPILOT_AI_REPORT_QUERY_READ_TIMEOUT:-75s}
      EDUPILOT_AI_CRITERIA_READ_TIMEOUT: ${EDUPILOT_AI_CRITERIA_READ_TIMEOUT:-90s}
      EDUPILOT_AI_EXAM_DRAFT_READ_TIMEOUT: ${EDUPILOT_AI_EXAM_DRAFT_READ_TIMEOUT:-120s}
      EDUPILOT_QUIZ_PASS_RATIO: ${EDUPILOT_QUIZ_PASS_RATIO:-0.6}
      EDUPILOT_QUIZ_PROPOSAL_MIN_PAGE_TEXT_LENGTH: ${EDUPILOT_QUIZ_PROPOSAL_MIN_PAGE_TEXT_LENGTH:-200}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads:/var/lib/edupilot/storage
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - edupilot-net

  ai-service:
    profiles:
      - ai
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ${AI_SERVICE_IMAGE:-ghcr.io/autoai-edupilot/ai-service:pending}
    environment:
      EDUPILOT_INTERNAL_TOKEN: ${EDUPILOT_INTERNAL_TOKEN}
      XAI_API_KEY: ${XAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-grok-4.5}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edupilot-net

volumes:
  mysql-data:
  uploads:

networks:
  edupilot-net:
    driver: bridge
