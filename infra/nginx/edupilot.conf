server {
    listen 80;
    listen [::]:80;
    server_name ${EDUPILOT_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${EDUPILOT_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/edupilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edupilot/privkey.pem;

    client_max_body_size 50m;

    location ~ ^/api/sessions/[^/]+/stream$ {
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 240s;
    }

    location /api/ {
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
