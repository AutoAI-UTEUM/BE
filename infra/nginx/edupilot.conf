limit_req_zone $binary_remote_addr zone=ai_rl:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ${EDUPILOT_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The ^~ ACME location takes priority over this regex for certificate renewal.
    location ~ /\. { return 404; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${EDUPILOT_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/edupilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edupilot/privkey.pem;

    client_max_body_size 50m;

    location ~ /\. { return 404; }

    location ~ ^/api/sessions/[^/]+/stream$ {
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 240s;
    }

    location = /api/health {
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/sessions/[0-9]+/turns$ {
        limit_req zone=ai_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/classrooms/[0-9]+/exams/[0-9]+/draft-questions$ {
        limit_req zone=ai_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/exams/[0-9]+/submissions$ {
        limit_req zone=ai_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/materials/[0-9]+/doc-chat$ {
        limit_req zone=ai_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/materials/[0-9]+/quiz-chat$ {
        limit_req zone=ai_rl burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_rl burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://main-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
