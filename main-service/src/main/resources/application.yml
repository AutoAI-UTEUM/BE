spring:
  application:
    name: main-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

edupilot:
  cors:
    allowed-origins: ${EDUPILOT_CORS_ALLOWED_ORIGINS}
  ai:
    internal-token: ${EDUPILOT_INTERNAL_TOKEN}
    connect-timeout: 3s
    read-timeout: 30s
    turn-read-timeout: ${EDUPILOT_AI_TURN_READ_TIMEOUT:180s}
    grade-read-timeout: ${EDUPILOT_AI_GRADE_READ_TIMEOUT:90s}
    pipeline-read-timeout: ${EDUPILOT_AI_PIPELINE_READ_TIMEOUT:45s}
    extract-read-timeout: ${EDUPILOT_AI_EXTRACT_READ_TIMEOUT:120s}
    health-path: /health
  quiz:
    pass-ratio: ${EDUPILOT_QUIZ_PASS_RATIO:0.6}
  material:
    upload-max-mb: ${EDUPILOT_UPLOAD_MAX_MB:45}
    max-pages: 300
    page-text-api-enabled: false
  jwt:
    secret: ${EDUPILOT_JWT_SECRET}
    access-token-ttl: 1h
    refresh-token-ttl: 14d

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
