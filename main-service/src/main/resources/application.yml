spring:
  application:
    name: main-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

edupilot:
  cors:
    allowed-origins: ${EDUPILOT_CORS_ALLOWED_ORIGINS}
  ai:
    internal-token: ${EDUPILOT_INTERNAL_TOKEN}
    connect-timeout: 3s
    read-timeout: 30s
    health-path: /health

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
